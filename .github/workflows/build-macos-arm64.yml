name: Build SINE for Apple Silicon

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - "SINE/**"
      - ".github/workflows/build-macos-arm64.yml"

permissions:
  contents: read

jobs:
  build:
    name: Build SINE.app (macOS arm64)
    runs-on: macos-15
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up ARM64 Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          architecture: aarch64

      - name: Install Apache Ant
        run: |
          brew install ant
          ant -version
          java -version
          uname -m

      - name: Build SINE JAR
        run: ant -f SINE/build.xml clean jar

      - name: Assemble application and dependency JARs
        run: |
          mkdir -p package-input/lib
          cp SINE/dist/SINE.jar package-input/
          cp SINE/lib/*.jar package-input/lib/
          test -f package-input/SINE.jar
          test -n "$(find package-input/lib -name '*.jar' -print -quit)"
          echo "Application JARs:"
          find package-input -name '*.jar' -type f -print

      - name: Package as macOS app with bundled Java runtime
        run: |
          jpackage \
            --type app-image \
            --input package-input \
            --dest build/package \
            --name SINE \
            --main-jar SINE.jar \
            --main-class com.dosse.bwentrain.player.Main \
            --class-path "lib/*" \
            --icon _SETUP/Mac/icon.icns \
            --app-version 1.8.8 \
            --mac-package-identifier com.dosse.bwentrain.player \
            --java-options "-Dsun.java2d.dpiaware=true" \
            --java-options "-Dsun.java2d.noddraw=true"

      - name: Verify app architecture and dependencies
        run: |
          test -d build/package/SINE.app
          file build/package/SINE.app/Contents/MacOS/SINE
          file build/package/SINE.app/Contents/runtime/Contents/Home/lib/server/libjvm.dylib
          test -d build/package/SINE.app/Contents/app/lib
          test "$(find build/package/SINE.app/Contents/app/lib -name '*.jar' | wc -l | tr -d ' ')" -ge 1
          cat build/package/SINE.app/Contents/app/SINE.cfg
          grep -F 'lib/*' build/package/SINE.app/Contents/app/SINE.cfg

      - name: Create ZIP archive
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            build/package/SINE.app SINE-macOS-arm64.zip
          ls -lh SINE-macOS-arm64.zip

      - name: Upload app artifact
        uses: actions/upload-artifact@v4
        with:
          name: SINE-macOS-arm64
          path: SINE-macOS-arm64.zip
          if-no-files-found: error
          retention-days: 14
